name: Build release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: npm run tauri build
      - run: ./scripts/package-release.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: release-artifacts/*
          if-no-files-found: error
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match package.json version' }
          gh release create $env:GITHUB_REF_NAME --verify-tag --draft --title "Sensor Layout Studio $version" --notes-file docs/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          gh release upload $env:GITHUB_REF_NAME (Get-ChildItem release-artifacts -File).FullName
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
